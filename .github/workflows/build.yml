name: Build Piradex MV (macOS — VST3 + AU)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Collect plugins
        run: |
          mkdir -p out
          find build -name "*.component" -exec cp -R {} out/ \; || true
          find build -name "*.vst3"      -exec cp -R {} out/ \; || true
          find build -name "*.app"       -exec cp -R {} out/ \; || true
          ls -R out

      - name: Zip plugins
        run: |
          cd out
          zip -r ../LEVEL-X-macOS.zip . -x "*.DS_Store"
          cd ..
          ls -la LEVEL-X-macOS.zip

      - name: Build installer (.pkg)
        run: |
          set -e
          VER=1.0.0
          mkdir -p pkgroot/vst3 pkgroot/au build-pkg
          cp -R out/LEVEL-X.vst3      pkgroot/vst3/
          cp -R out/LEVEL-X.component pkgroot/au/
          chmod +x installer/scripts/postinstall

          # componente VST3
          pkgbuild --identifier com.beatfreak.levelx.vst3 --version "$VER" \
            --install-location "/Library/Audio/Plug-Ins/VST3" \
            --root pkgroot/vst3 build-pkg/vst3.pkg

          # componente AU (com postinstall para remover a quarentena dos dois)
          pkgbuild --identifier com.beatfreak.levelx.au --version "$VER" \
            --install-location "/Library/Audio/Plug-Ins/Components" \
            --scripts installer/scripts \
            --root pkgroot/au build-pkg/au.pkg

          # instalador combinado
          productbuild --distribution installer/Distribution.xml \
            --package-path build-pkg \
            --resources installer/resources \
            "LEVEL-X-Installer.pkg"
          ls -la LEVEL-X-Installer.pkg

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: LEVEL-X-macOS
          path: |
            out/
            LEVEL-X-Installer.pkg

      - name: Publish release (download via github.com)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LEVEL-X latest build
          files: |
            LEVEL-X-macOS.zip
            LEVEL-X-Installer.pkg
          fail_on_unmatched_files: true
