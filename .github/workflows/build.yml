name: Build LEVEL-X (macOS VST3+AU / Windows VST3)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        run: |
          if [ -n "${{ secrets.MACOS_CERTIFICATE }}" ]; then echo "HAS_SIGN=true" >> $GITHUB_ENV; else echo "HAS_SIGN=false" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.APPLE_ID }}" ];        then echo "HAS_NOTARIZE=true" >> $GITHUB_ENV; else echo "HAS_NOTARIZE=false" >> $GITHUB_ENV; fi

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Collect plugins
        run: |
          mkdir -p out
          find build -name "*.component" -exec cp -R {} out/ \; || true
          find build -name "*.vst3"      -exec cp -R {} out/ \; || true
          find build -name "*.app"       -exec cp -R {} out/ \; || true
          ls -R out

      - name: Import signing certificates
        if: env.HAS_SIGN == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          echo "$MACOS_CERTIFICATE" | base64 --decode > app.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import app.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          if [ -n "$MACOS_INSTALLER_CERTIFICATE" ]; then
            echo "$MACOS_INSTALLER_CERTIFICATE" | base64 --decode > inst.p12
            security import inst.p12 -k build.keychain -P "$MACOS_INSTALLER_CERTIFICATE_PWD" -T /usr/bin/productbuild
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v build.keychain

      - name: Codesign plugins
        if: env.HAS_SIGN == 'true'
        env:
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -e
          for b in out/LEVEL-X.vst3 out/LEVEL-X.component out/LEVEL-X.app; do
            [ -e "$b" ] || continue
            codesign --force --deep --options runtime --timestamp \
              --sign "$SIGN_ID" "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
          done

      - name: Zip plugins
        run: |
          cd out
          zip -r ../LEVEL-X-macOS.zip . -x "*.DS_Store"
          cd ..
          ls -la LEVEL-X-macOS.zip

      - name: Build installer (.pkg)
        run: |
          set -e
          VER=1.0.0
          mkdir -p pkgroot/vst3 pkgroot/au build-pkg
          cp -R out/LEVEL-X.vst3      pkgroot/vst3/
          cp -R out/LEVEL-X.component pkgroot/au/
          chmod +x installer/scripts/postinstall

          # componente VST3
          pkgbuild --identifier com.beatfreak.levelx.vst3 --version "$VER" \
            --install-location "/Library/Audio/Plug-Ins/VST3" \
            --root pkgroot/vst3 build-pkg/vst3.pkg

          # componente AU (com postinstall para remover a quarentena dos dois)
          pkgbuild --identifier com.beatfreak.levelx.au --version "$VER" \
            --install-location "/Library/Audio/Plug-Ins/Components" \
            --scripts installer/scripts \
            --root pkgroot/au build-pkg/au.pkg

          # instalador combinado (assinado se houver certificado de Installer)
          if [ "$HAS_SIGN" = "true" ] && [ -n "${{ secrets.MACOS_INSTALLER_IDENTITY }}" ]; then
            productbuild --distribution installer/Distribution.xml \
              --package-path build-pkg --resources installer/resources \
              --sign "${{ secrets.MACOS_INSTALLER_IDENTITY }}" \
              "LEVEL-X-Installer.pkg"
          else
            productbuild --distribution installer/Distribution.xml \
              --package-path build-pkg --resources installer/resources \
              "LEVEL-X-Installer.pkg"
          fi
          ls -la LEVEL-X-Installer.pkg

      - name: Notarize installer
        if: env.HAS_NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -e
          xcrun notarytool submit "LEVEL-X-Installer.pkg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "LEVEL-X-Installer.pkg"
          xcrun stapler validate "LEVEL-X-Installer.pkg" || true

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: LEVEL-X-macOS
          path: |
            out/
            LEVEL-X-Installer.pkg

      - name: Publish release (download via github.com)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LEVEL-X latest build
          files: |
            LEVEL-X-macOS.zip
            LEVEL-X-Installer.pkg
          fail_on_unmatched_files: true

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null

      - name: Diagnostics
        shell: pwsh
        run: |
          cmake --version *>&1 | Tee-Object -FilePath win-configure.log
          "--- generators ---" | Tee-Object -Append win-configure.log
          cmake --help *>&1 | Select-String -Pattern "Visual Studio|Ninja" | Tee-Object -Append win-configure.log

      - name: Configure
        shell: pwsh
        run: |
          cmake -B C:/b -G "Visual Studio 17 2022" -A x64 *>&1 | Tee-Object -Append win-configure.log
          exit $LASTEXITCODE

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build C:/b --config Release *>&1 | Tee-Object -Append win-configure.log
          exit $LASTEXITCODE

      - name: Capture logs on failure
        if: failure()
        shell: pwsh
        run: |
          Copy-Item C:/b/CMakeFiles/CMakeError.log  win-CMakeError.log  -ErrorAction SilentlyContinue
          Copy-Item C:/b/CMakeFiles/CMakeOutput.log win-CMakeOutput.log -ErrorAction SilentlyContinue
          if (-not (Test-Path win-CMakeError.log))  { "no CMakeError.log"  | Out-File win-CMakeError.log }
          if (-not (Test-Path win-CMakeOutput.log)) { "no CMakeOutput.log" | Out-File win-CMakeOutput.log }

      - name: Publish logs on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: winlogs
          name: Windows build logs
          files: |
            win-configure.log
            win-CMakeError.log
            win-CMakeOutput.log

      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $vst3 = Get-ChildItem -Path C:/b -Recurse -Directory -Filter "LEVEL-X.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "LEVEL-X.vst3 não encontrado" }
          Copy-Item -Recurse -Force $vst3.FullName "out\LEVEL-X.vst3"
          Get-ChildItem -Recurse out | Select-Object FullName

      - name: Zip VST3
        shell: pwsh
        run: Compress-Archive -Path out\LEVEL-X.vst3 -DestinationPath LEVEL-X-Windows-VST3.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DVST3SRC=$PWD\out\LEVEL-X.vst3" "/DOUTDIR=$PWD" `
            installer\windows\LEVEL-X.iss
          Get-ChildItem LEVEL-X-Installer-Windows.exe

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: LEVEL-X-Windows
          path: |
            LEVEL-X-Windows-VST3.zip
            LEVEL-X-Installer-Windows.exe

      - name: Publish release (download via github.com)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LEVEL-X latest build
          files: |
            LEVEL-X-Windows-VST3.zip
            LEVEL-X-Installer-Windows.exe
          fail_on_unmatched_files: true
